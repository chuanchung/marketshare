name: Update official data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start_month:
        description: 'First historical month (YYYY-MM); bundled data begins 2015-01'
        required: false
        default: '2015-01'
  schedule:
    - cron: '50 23 * * *'
      timezone: 'Asia/Taipei'
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BROKER_TLS_COMPAT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Fetch newly available official months
        if: github.event_name != 'push'
        env:
          START_MONTH: ${{ inputs.start_month || '2015-01' }}
        run: python scripts/update_data.py --start "$START_MONTH"
      - name: Validate data and calculations
        run: |
          npm test
          node --check site/app.js
          node --check site/engine.js
      - name: Save newly verified monthly data
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- site/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update verified official monthly data"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
