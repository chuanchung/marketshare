name: Update official data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start_month:
        description: 'First historical month (YYYY-MM); bundled data begins 2015-01'
        required: false
        default: '2015-01'
  schedule:
    - cron: '50 23 * * *'
      timezone: 'Asia/Taipei'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Fetch newly available official months
        if: github.event_name != 'push'
        env:
          START_MONTH: ${{ inputs.start_month || '2015-01' }}
        run: python scripts/update_data.py --start "$START_MONTH"
      - name: Refresh recent reports for official corrections
        if: github.event_name != 'push'
        run: |
          START=$(python -c "import datetime as d; t=d.date.today().replace(day=1); print((t-d.timedelta(days=93)).strftime('%Y-%m'))")
          python scripts/update_data.py --start "$START" --refresh
      - name: Validate data and calculations
        run: |
          npm test
          node --check site/app.js
          node --check site/engine.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
